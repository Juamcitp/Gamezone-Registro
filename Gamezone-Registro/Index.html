<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GAMEZONE</h1>
        <button id="btnCambiar">Iniciar Sesión</button>
    </header>

    <main class="contenedor">

        
        <section id="sec-registro">
            <h2>Registro de Usuario</h2>
            <form id="formRegistro">
                <div class="campo">
                    <label>Nombre Completo *</label>
                    <input type="text" id="nombre">
                    <p class="error" id="err-nombre"></p>
                </div>

                <div class="campo">
                    <label>Correo Electrónico (@duoc.cl) *</label>
                    <input type="email" id="correo" placeholder="ejemplo@duoc.cl">
                    <p class="error" id="err-correo"></p>
                </div>

                <div class="campo">
                    <label>Contraseña *</label>
                    <input type="password" id="pass">
                    <p class="error" id="err-pass"></p>
                </div>

                <div class="campo">
                    <label>Confirmar Contraseña *</label>
                    <input type="password" id="confirmPass">
                    <p class="error" id="err-confirm"></p>
                </div>

                <div class="campo">
                    <label>Teléfono (Opcional)</label>
                    <input type="text" id="telefono">
                    <p class="error" id="err-telefono"></p>
                </div>

                <div class="campo">
                    <label>Géneros Favoritos *</label>
                    <div class="generos">
                        <label><input type="checkbox" name="genero" value="Ficcion"> Ficción</label>
                        <label><input type="checkbox" name="genero" value="No Ficcion"> No Ficción</label>
                        <label><input type="checkbox" name="genero" value="Misterio"> Misterio</label>
                        <label><input type="checkbox" name="genero" value="Terror"> Terror</label>
                        <label><input type="checkbox" name="genero" value="Suspenso"> Suspenso</label>
                        <label><input type="checkbox" name="genero" value="Historia"> Historia</label>
                    </div>
                    <p class="error" id="err-genero"></p>
                </div>

                <button type="submit" class="btn">Registrarse</button>
            </form>
        </section>

        <section id="sec-login" class="oculto">
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div class="campo">
                    <label>Correo</label>
                    <input type="email" id="loginCorreo">
                </div>

                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" id="loginPass">
                </div>

                <p class="error" id="err-login"></p>
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
