<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Registro y Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#" class="logo">GAMEZONE</a>
        <button id="toggle-form-btn" class="btn-secondary">Iniciar Sesión</button>
    </header>

    <main class="container">
        <!-- FORMULARIO DE LOGIN -->
        <section id="login-section" class="form-box hidden">
            <h2>Iniciar Sesión</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" placeholder="usuario@duoc.cl">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password">
                </div>
                <div id="login-error" class="error-msg"></div>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </section>

        <!-- FORMULARIO DE REGISTRO -->
        <section id="register-section" class="form-box">
            <h2>Registro de Usuario</h2>
            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input type="text" id="nombre" maxlength="100">
                    <span class="error-msg" id="error-nombre"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico (@duoc.cl) *</label>
                    <input type="email" id="email" maxlength="60" placeholder="ejemplo@duoc.cl">
                    <span class="error-msg" id="error-email"></span>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password">
                    <span class="error-msg" id="error-password"></span>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña *</label>
                    <input type="password" id="confirm-password">
                    <span class="error-msg" id="error-confirm"></span>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono (Opcional)</label>
                    <input type="tel" id="telefono" placeholder="+56912345678">
                    <span class="error-msg" id="error-telefono"></span>
                </div>

                <div class="form-group">
                    <label>Géneros Favoritos * (Seleccione al menos uno)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="generos" value="FICCION"> Ficción</label>
                        <label><input type="checkbox" name="generos" value="NO FICCION"> No Ficción</label>
                        <label><input type="checkbox" name="generos" value="MISTERIO"> Misterio</label>
                        <label><input type="checkbox" name="generos" value="TERROR"> Terror</label>
                        <label><input type="checkbox" name="generos" value="SUSPENSO"> Suspenso</label>
                        <label><input type="checkbox" name="generos" value="HISTORIA"> Historia</label>
                    </div>
                    <span class="error-msg" id="error-generos"></span>
                </div>

                <button type="submit" class="btn-primary">Registrar</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
